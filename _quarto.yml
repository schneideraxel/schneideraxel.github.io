project:
  type: website
  output-dir: docs
  render:
    - index.qmd

website:
  title: "Axel Schneider"
  site-url: https://schneideraxel.github.io
  description: "Axel Schneider is a predoctoral researcher at Cornell University with research interests in development economics and network theory."
  open-graph: true
  twitter-card: true
  search: false
  page-footer:
    left: "© 2026 Axel Schneider"
    right: "Built with [Quarto](https://quarto.org/)."

format:
  html:
    theme: default
    css: site.css
    toc: false
    section-divs: false
    pagetitle: "Development Economist at Cornell University"
    anchor-sections: false
    smooth-scroll: true
    include-in-header:
      text: |
        <link rel="canonical" href="https://schneideraxel.github.io/">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "ProfilePage",
          "url": "https://schneideraxel.github.io/",
          "mainEntity": {
            "@type": "Person",
            "name": "Axel Schneider",
            "url": "https://schneideraxel.github.io/",
            "image": "https://schneideraxel.github.io/axel.jpg",
            "jobTitle": "Predoctoral Research Fellow",
            "affiliation": {
              "@type": "Organization",
              "name": "Cornell University",
              "url": "https://www.cornell.edu/"
            },
            "sameAs": [
              "https://github.com/schneideraxel",
              "https://linkedin.com/in/axel-schneider-1798492ba",
              "https://business.cornell.edu/centers/cider/predocs/",
              "https://logri.org/fr/profile/schneider-axel/"
            ]
          }
        }
        </script>
